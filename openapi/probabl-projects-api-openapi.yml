          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - projects
      summary: Filter
      description: List all cross-validation reports for a given dataset.
      operationId: filter_projects__workspace_public_id___project_name__cross_validation_reports_get
      deprecated: true
      parameters:
      - name: workspace_public_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Public Id
      - name: project_name
        in: path
        required: true
        schema:
          type: string
          title: Project Name
      - name: dataset_fingerprint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Fingerprint
      - name: ml_task
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ml Task
      - name: estimator_class_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Estimator Class Name
      - name: data_source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Source
      - name: config_file
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Config File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrossValidationReportSummary'
                title: Response Filter Projects  Workspace Public Id   Project Name  Cross Validation Reports Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{workspace_public_id}/{project_name}/cross-validation-reports/groups:
    get:
      tags:
      - projects
      summary: List Groups
      description: 'List all cross validation reports stored in a project.


        CV reports are grouped by dataset fingerprint and sorted by ascending

