      description: "Across validation report.\n\nAttributes\n----------\nsplitting_strategy : SplittingStrategy\n    Information about the splitting strategy used.\ngroups : list[int] | None\n    Index of the group for each sample in the dataset.\nclass_names : list[str] | None\n    All class names of the dataset.\ntarget_ranges_normalized : list[list[float]] | None\n    The range of the target values, one [min, max] pair per output.\ntarget_names: list[str] | None\n    The name of the targets.\ndataset_size : int\n    The size of the dataset.\nestimators : list[EstimatorReportId]\n    List of estimator report IDs evaluated in the cross-validation.\nmedias : list[ReportMedia]\n    List of media associated with the cross-validation report.\npickle : ReportPickle\n    The pickle associated with the estimator report."
