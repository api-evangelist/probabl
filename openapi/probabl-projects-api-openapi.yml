      type: object
      title: HTTPValidationError
    CreateReportMediaParameters:
      properties:
        name:
          type: string
          title: Name
        content_type:
          type: string
          title: Content Type
        data_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Data Source
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Parameters
        checksum:
          type: string
          title: Checksum
      type: object
      required:
      - name
      - content_type
      - checksum
      title: CreateReportMediaParameters
      description: "Parameter object to create a `ReportMediaModel`.\n\nAttributes\n----------\nname : str\n    The name of the media (e.g., \"confusion_matrix\").\ncontent_type : str\n    The type of media (e.g., \"image/png\", \"text/csv\").\ndata_source : str | None\n    Optional source of the media data (e.g., \"validation\", \"test\").\nparameters : dict | None\n    Optional parameters identifying the media type variant.\nchecksum : str\n    The checksum of the media file for integrity verification."
    PotentialGoalMetric:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          maxLength: 64
          title: Name
        verbose_name:
          type: string
          maxLength: 150
          title: Verbose Name
        greater_is_better:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Greater Is Better
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        output:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output
        average:
          anyOf:
          - type: string
          - type: 'null'
          title: Average
      type: object
      required:
      - id
      - name
      - verbose_name
      - greater_is_better
      title: PotentialGoalMetric
      description: A metric variant eligible as a project goal.
    ProjectGoalMeetingReportsCount:
      properties:
        meeting_count:
          type: integer
          title: Meeting Count
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - meeting_count
      - total_count
      title: ProjectGoalMeetingReportsCount
      description: Count of reports on a dataset that meet all goals.
    GenerateUploadUrlRequest:
      properties:
        checksum:
          type: string
          title: Checksum
        chunk_number:
          type: integer
          title: Chunk Number
          default: 0
        content_type:
          type: string
          title: Content Type
      type: object
      required:
      - checksum
      - content_type
      title: GenerateUploadUrlRequest
      description: 'Represent an upload URL request for a new artifact.


        To request an upload URL for an artifact, the user needs to provide a checksum

        that is unique to the project, a content type, and optionally, the number of chunks

        for initiating a multipart upload.


        In the case of a multipart upload, the user will receive as many upload URLs as

        specified in the `chunk_number` field.


        If `chunk_number` is less than `2`, a single upload URL will be generated without

        using multipart.'
    CrossValidationReport:
      properties:
        id:
          type: integer
          title: Id
        project_id:
          type: integer
          title: Project Id
        creator_id:
          type: string
          title: Creator Id
        key:
          type: string
          title: Key
        ml_task:
          type: string
          enum:
          - regression
          - multioutput-regression
          - binary-classification
          - multiclass-classification
          - multiclass-multioutput
          - multioutput-multiclass-classification
          - multioutput-binary-classification
          - unknown
          title: Ml Task
        estimator_class_name:
          type: string
          title: Estimator Class Name
        dataset_fingerprint:
          type: string
          title: Dataset Fingerprint
        dataset_verbose_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Verbose Name
        metrics:
          items:
            $ref: '#/components/schemas/ReportMetric'
          type: array
          title: Metrics
        canonical_report_id:
          anyOf:
          - type: string
            format: uuid4
          - type: string
            format: uuid7
          - type: 'null'
          title: Canonical Report Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        splitting_strategy:
          $ref: '#/components/schemas/SplittingStrategy'
        groups:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Groups
        class_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Class Names
        target_ranges_normalized:
          anyOf:
          - items:
              items:
                type: number
              type: array
            type: array
          - type: 'null'
          title: Target Ranges Normalized
        target_names:
          anyOf:
          - items:
