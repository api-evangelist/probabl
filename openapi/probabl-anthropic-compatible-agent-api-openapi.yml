openapi: 3.2.0
info:
  title: Skore Hub Anthropic Compatible Agent API
  description: "\nThis REST API is divided in small services.\nEach service has its own OpenAPI specification.\n- [identity](/identity/docs)\n- [projects](/projects/docs)\n    "
  version: 0.1.0
tags:
- name: Anthropic Compatible Agent
paths:
  /v1/messages:
    post:
      tags:
      - Anthropic Compatible Agent
      summary: Anthropic Messages
      description: Run one Anthropic-compatible Messages API turn (optionally streamed).
      operationId: anthropic_messages_v1_messages_post
      parameters:
      - name: config_file
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Config File
      - name: x-skore-workspace
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Skore-Workspace
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
