components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CreateWorkspaceInvitationLinkRequest:
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      type: object
      required:
      - role
      title: CreateWorkspaceInvitationLinkRequest
      description: Create a shareable workspace invitation URL.
    InitiateDeviceAuthResponse:
      properties:
        authorization_url:
          type: string
          title: Authorization Url
        device_code:
          type: string
          title: Device Code
        user_code:
          type: string
          title: User Code
      type: object
      required:
      - authorization_url
      - device_code
      - user_code
      title: InitiateDeviceAuthResponse
      description: Response with device authentication details.
    UpdateWorkspaceRequest:
      properties:
        public_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Public Id
      type: object
      required:
      - public_id
      title: UpdateWorkspaceRequest
      description: Workspace update request.
    Body_create_workspace_invitation_identity_workspaces__workspace_id__invitations_post:
      properties:
        email:
          type: string
          format: email
          title: Email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      type: object
      required:
      - email
      - role
      title: Body_create_workspace_invitation_identity_workspaces__workspace_id__invitations_post
    CreateWorkspaceResponse:
      properties:
        id:
          type: integer
          title: Id
      type: object
      required:
      - id
      title: CreateWorkspaceResponse
      description: Workspace creation response.
    UpdateAPIKeyPayload:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        regenerate_api_key:
          type: boolean
          title: Regenerate Api Key
          default: false
      type: object
      title: UpdateAPIKeyPayload
      description: API key update payload.
    SetMemberRoleRequest:
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      type: object
      required:
      - role
      title: SetMemberRoleRequest
      description: Set a member's role; permissions are replaced from the static role map.
    RefreshTokenRequest:
      properties:
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
        success_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Success Uri
      type: object
      title: RefreshTokenRequest
      description: "Represents a request to refresh an access token.\n\nThe access token is refreshed using the refresh token provided during login.\nOnce a new access token is issued, the previous one becomes invalid immediately.\n\nAttributes\n----------\nrefresh_token : str\n    The refresh token obtained from the most recent authorization code exchange\n    with the IDP.\nsuccess_uri : str | None, optional\n    The URI to redirect the user to after a successful token refresh."
    ListWorkspaceResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Workspace'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ListWorkspaceResponse
      description: List workspaces request.
    Workspace:
      properties:
        id:
          type: integer
          title: Id
        public_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Public Id
        is_public:
          type: boolean
          title: Is Public
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        members:
          anyOf:
          - items:
              $ref: '#/components/schemas/WorkspaceMember'
            type: array
          - type: 'null'
          title: Members
      type: object
      required:
      - id
      - public_id
      - is_public
      - created_at
      - updated_at
      title: Workspace
      description: 'A workspace represents an isolated entity managing users, projects, and resources.


        A workspace can be a company, organization, or team that operates independently

        within the system.


        Attributes

        ----------

        `id` (`int`): Internal unique identifier for the workspace.

        `public_id` (`str`): Publicly exposed unique identifier.

        `created_at` (`datetime`): Timestamp when the workspace was created.

        `updated_at` (`datetime`): Timestamp of the last update to the workspace.

        `deleted_at` (`datetime`): Timestamp when the workspace was deleted (if applicable).'
    UserAPIKey:
      properties:
        id:
          type: integer
          title: Id
        user_id:
          type: string
          title: User Id
        workspace_id:
          type: integer
          title: Workspace Id
        name:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - id
      - user_id
      - workspace_id
      - created_at
      - updated_at
      title: UserAPIKey
      description: 'User API key.


        Allows users to access the Skore Hub API without an IDP bearer token.


        The API key itself (hashed version) is not accessible; users must copy

        and save it upon generation.


        If the key is lost, the user must generate a new key hash.'
    Permission:
      type: string
      enum:
      - create:project
      - read:project
      - update:project
      - delete:project
      - create:invitation
      - read:invitation
      - delete:invitation
      title: Permission
      description: 'A permission.


        The actual ground-truth permissions are the ones stored in the

        database; this type is used to avoid typos in permissions.'
    WorkspaceInvitationLinkResponse:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: WorkspaceInvitationLinkResponse
      description: Shareable invitation URL (same acceptance path as email invitations).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkspaceMembershipInfo:
      properties:
        workspace_id:
          type: integer
          title: Workspace Id
        public_id:
          type: string
          maxLength: 64
          title: Public Id
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - workspace_id
      - public_id
      - role
      - permissions
      title: WorkspaceMembershipInfo
      description: One workspace membership with role and effective permission names.
    CreateAPIKeyResponse:
      properties:
        api_key_id:
          type: integer
          title: Api Key Id
        api_key:
          type: string
          title: Api Key
      type: object
      required:
      - api_key_id
      - api_key
      title: CreateAPIKeyResponse
      description: Response of "create API key" endpoint.
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        expires_in:
          type: integer
          title: Expires In
        id_token:
          type: string
          title: Id Token
        token_type:
          type: string
          title: Token Type
        scope:
          type: string
          title: Scope
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
      type: object
      required:
      - access_token
      - expires_in
      - id_token
      - token_type
      - scope
      title: Token
      description: "Represents an access token and related details obtained during authentication.\n\nAttributes\n----------\naccess_token : str\n    The token used to access protected resources.\nexpires_in : int\n    The duration (in seconds) until the token expires.\nid_token : str\n    The token containing identity claims for the authenticated user.\ntoken_type : str\n    The type of token (e.g., \"Bearer\").\nscope : str\n    The scope of permissions granted by the token.\nrefresh_token : str | None, optional\n    The token used to obtain a new access token without re-authenticating.\nexpires_at: datetime | None, optional\n    The access_token expiration timestamp."
    WorkspaceMember:
      properties:
        workspace_id:
          type: integer
          title: Workspace Id
        user_id:
          type: string
          title: User Id
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        invited_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Invited By
      type: object
      required:
      - workspace_id
