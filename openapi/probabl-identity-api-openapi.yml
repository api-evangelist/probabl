          title: State
        user_code:
          type: string
          title: User Code
      type: object
      required:
      - state
      - user_code
      title: Body_oauth_device_callback_validation_identity_oauth_device_callback_post
    ExchangeCodeResponse:
      properties:
        token:
          $ref: '#/components/schemas/Token'
