          anyOf:
          - type: string
          - type: 'null'
          title: Success Uri
      type: object
      required:
      - token
      title: ExchangeCodeResponse
      description: "Response containing the exchanged token.\n\nAttributes\n----------\ntoken : Token\n    The token obtained from the authorization code exchange with IDP.\nsuccess_uri : str | None\n    The URI to redirect the user at in case of successful login flow."
    LoginResponse:
