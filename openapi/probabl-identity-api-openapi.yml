          maxLength: 255
          format: email
          title: Email
        first_name:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
          title: Last Name
        company:
