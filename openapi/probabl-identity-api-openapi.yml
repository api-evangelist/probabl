      description: "Represents a response containing the authorization URL.\n\nAttributes\n----------\nauthorization_url : str\n    The URL where the user should be redirected to complete the login."
    WorkspaceRole:
      type: string
      enum:
      - owner
      - contributor
      - reader
      title: WorkspaceRole
      description: Role of a user within a workspace.
    CreateWorkspaceRequest:
      properties:
        public_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Public Id
      type: object
      required:
      - public_id
      title: CreateWorkspaceRequest
      description: Workspace creation request.
    CreateAPIKeyPayload:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        permissions:
          items:
            $ref: '#/components/schemas/Permission'
          type: array
          title: Permissions
        workspace_id:
          type: integer
          title: Workspace Id
