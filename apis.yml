aid: probabl
name: Probabl
description: >-
  Probabl (styled ":probabl.") is the French, Inria-spun-out company behind scikit-learn — "the Tabular AI company by
  the creators of scikit-learn" — founded in 2023 to develop, maintain and commercially sustain the open-source Python
  data-science stack (scikit-learn, skrub, skore). Its commercial product is Skore: an open-source Python library
  (`skore`) that turns model training into structured, auditable artifacts — estimator reports, cross-validation
  reports, comparison reports, data and metric diagnostics — plus Skore Hub, a hosted collaboration platform where
  teams push, compare and track those artifacts across workspaces and projects. Skore Hub exposes a public REST API
  (Skore Hub, OpenAPI 3.1.0, 67 operations) covering identity/OAuth, workspaces, members and API keys, projects,
  estimator/cross-validation/comparison reports, artifacts, project goals, and OpenAI/Anthropic-compatible agent
  endpoints. Probabl also publishes a first-party Agent Skills package (probabl-skills, BSD-3-Clause) of 14 data-science
  skills for coding agents such as Claude Code and Cursor, a `skore` CLI, training via Skolar, and the Scikit-learn
  Central ecosystem explorer.
