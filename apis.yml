apis:
- name: Skore Hub API
  description: >-
    Public REST API for Skore Hub, Probabl's hosted collaboration platform for machine-learning experiments. Covers
    identity (OAuth authorization-code and device flows, token refresh, user profile, per-workspace API keys),
    workspaces (creation, membership, roles, invitations), projects, and the report surface — estimator reports,
    cross-validation reports, comparison reports, report groups, metrics, media, pickles and environments — plus
    presigned artifact upload/read, project goals, LLM provider configuration, and OpenAI-/Anthropic-compatible agent
    completion endpoints. OpenAPI 3.1.0 with 67 operations across 51 paths and 70 component schemas, served live at
    https://api.skore.probabl.ai/openapi.json.
